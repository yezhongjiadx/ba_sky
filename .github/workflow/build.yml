name: Build SkyBox

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download shaderc and MaterialBinTool
        run: |
          # 下载 Linux 版本的 shaderc (来自可靠的开源构建)
          wget https://github.com/bkaradzic/bgfx/releases/download/v1.129.8898-394/bgfx-tools-linux.tar.gz
          tar -xzf bgfx-tools-linux.tar.gz
          chmod +x shaderc
          
          # 下载 MaterialBinTool
          wget https://github.com/ddf8196/MaterialBinTool/releases/download/v0.9.1/MaterialBinTool-0.9.1-all.jar

      - name: Fix JSON and Build Material
        run: |
          # 自动修正 JSON 编码，防止云端报错
          sed -i 's/\r$//' ./lazurite_build/SkyBox/SkyBox.material.json
          
          # 创建输出目录 (这步是之前报错的元凶)
          mkdir -p ./output
          
          # 直接强行编译
          java -jar MaterialBinTool-0.9.1-all.jar -c ./lazurite_build/SkyBox/SkyBox.material.json -o ./output --shaderc ./shaderc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyBox-material
          path: ./output/