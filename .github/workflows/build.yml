name: Build SkyBox with Lazurite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools & Headers
        run: |
          pip install lazurite
          wget https://build.lwjgl.org/nightly/linux/x64/bgfx-tools/shaderc
          chmod +x ./shaderc
          
          # 下载之前导致 83 字节空壳的“罪魁祸首”——官方头文件
          wget https://raw.githubusercontent.com/bkaradzic/bgfx/master/src/bgfx_shader.sh

      - name: Compile with Lazurite
        run: |
          # 把源码和头文件全部塞进 Lazurite 的工作目录
          mkdir -p lazurite_build/SkyBox/shaders
          cp Sky.vertex.sc lazurite_build/SkyBox/shaders/
          cp Sky.fragment.sc lazurite_build/SkyBox/shaders/
          cp bgfx_shader.sh lazurite_build/SkyBox/shaders/
          
          mkdir -p output
          
          # 强行指定头文件路径 (-i) 并执行编译
          lazurite build "./lazurite_build" -o "./output" --shaderc "./shaderc" -i "./lazurite_build/SkyBox/shaders"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Material-Bin
          path: ./output/