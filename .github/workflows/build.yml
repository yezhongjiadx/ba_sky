name: Build SkyBox Ultimate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build shaderc via CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y git make cmake g++ libx11-dev libgl1-mesa-dev xorg-dev
          
          # 使用官方的 CMake 项目编译，完全不需要 genie
          git clone https://github.com/bkaradzic/bgfx.cmake.git
          cd bgfx.cmake
          git submodule update --init --recursive
          
          # 配置 CMake，只编译工具
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBGFX_BUILD_TOOLS=ON
          
          # 开始编译
          cmake --build build -j$(nproc)
          
          # 自动找到生成的 shaderc 并复制到外层
          find build -name shaderc -type f -exec cp {} ../shaderc \;
          cd ..
          chmod +x shaderc
          ./shaderc --version

      - name: Download MaterialBinTool
        run: |
          wget https://github.com/ddf8196/MaterialBinTool/releases/download/v0.9.1/MaterialBinTool-0.9.1-all.jar

      - name: Generate Files and Compile
        run: |
          mkdir -p compile/SkyBox/src
          
          cat > compile/SkyBox/src/Sky.vertex.sc << 'EOF'
          $input a_position
          $output v_dir
          #include <bgfx_shader.sh>
          void main()
          {
              v_dir = a_position;
              gl_Position = mul(u_viewProj, vec4(a_position, 1.0));
          }
          EOF
          
          cat > compile/SkyBox/src/Sky.fragment.sc << 'EOF'
          $input v_dir
          #include <bgfx_shader.sh>
          SAMPLER2D(s_sky_tex, 0);
          void main()
          {
              vec3 dir = normalize(v_dir);
              float phi = atan(dir.z, dir.x);
              float theta = asin(dir.y);
              vec2 uv = vec2(phi / (2.0 * PI) + 0.5, theta / PI + 0.5);
              vec4 color = texture2D(s_sky_tex, uv);
              gl_FragColor = color;
          }
          EOF
          
          cat > compile/SkyBox/src/Sky.varying.def.sc << 'EOF'
          vec3 a_position  : POSITION;
          vec3 v_dir       : TEXCOORD0;
          EOF
          
          cat > compile/SkyBox/Sky.material.json << 'EOF'
          {
            "materials": {
              "version": 1,
              "Sky": {
                "vertexShader": "Sky.vertex",
                "fragmentShader": "Sky.fragment",
                "variants": [
                  {
                    "passes": [
                      {
                        "renderMode": "Sky",
                        "vertexShader": "Sky.vertex",
                        "fragmentShader": "Sky.fragment"
                      }
                    ]
                  }
                ]
              }
            }
          }
          EOF
          
          mkdir -p output
          java -jar MaterialBinTool-0.9.1-all.jar -c compile/SkyBox/Sky.material.json -o ./output --shaderc ./shaderc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Material-Bin
          path: ./output/