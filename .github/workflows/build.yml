name: Build SkyBox Ultimate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Tools
        run: |
          # 1. 下载绝对存在的官方老版本 Linux shaderc
          wget https://github.com/bkaradzic/bgfx/releases/download/v1.118.8416-338/bgfx-tools-linux.tar.gz
          tar -xzf bgfx-tools-linux.tar.gz
          chmod +x shaderc
          
          # 验证是否可用（万一版本太老，这里会报错）
          ./shaderc --version
          
          # 2. 下载 MaterialBinTool
          wget https://github.com/ddf8196/MaterialBinTool/releases/download/v0.9.1/MaterialBinTool-0.9.1-all.jar

      - name: Compile SkyBox
        run: |
          mkdir -p output
          # 3. 强制编译（用现成的 JSON 和你的代码）
          java -jar MaterialBinTool-0.9.1-all.jar -c "./lazurite_build/SkyBox/SkyBox.material.json" -o "./output" --shaderc "./shaderc"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Material-Bin
          path: ./output/