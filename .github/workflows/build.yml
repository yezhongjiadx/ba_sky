name: Build SkyBox Ultimate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build shaderc via Make
        run: |
          sudo apt-get update
          sudo apt-get install -y git make g++ libx11-dev libgl1-mesa-dev xorg-dev
          
          # 拉取源码
          git clone --recursive https://github.com/bkaradzic/bgfx.git
          cd bgfx
          
          # 【核心修复】：赋予 genie 执行权限，解决之前的 Error 127
          chmod +x bx/tools/bin/linux/genie
          
          # 开始编译 tools（包含 shaderc）
          make tools -j$(nproc)
          
          # 提取出来
          cp .build/linux64_gcc/bin/shadercRelease ../shaderc
          cd ..
          chmod +x shaderc
          ./shaderc --version

      - name: Download MaterialBinTool
        run: |
          wget https://github.com/ddf8196/MaterialBinTool/releases/download/v0.9.1/MaterialBinTool-0.9.1-all.jar

      - name: Compile your SkyBox
        run: |
          # 创建输出目录
          mkdir -p output
          
          # 直接用你仓库里现成的文件编译（不再现场生成了）
          # 注意：这里直接指向了你图2里的准确路径
          java -jar MaterialBinTool-0.9.1-all.jar -c "./lazurite_build/SkyBox/SkyBox.material.json" -o "./output" --shaderc "./shaderc"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Material-Bin
          path: ./output/