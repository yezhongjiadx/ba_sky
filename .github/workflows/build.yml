name: Build SkyBox Ultimate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Tools
        run: |
          wget https://build.lwjgl.org/nightly/linux/x64/bgfx-tools/shaderc
          chmod +x ./shaderc
          wget https://github.com/ddf8196/MaterialBinTool/releases/download/v0.9.1/MaterialBinTool-0.9.1-all.jar

      - name: Unpack, Inject, and Compile
        run: |
          mkdir -p output

          # 1. 反编译你提供的、带完整结构的 Sky.material.bin
          java -jar MaterialBinTool-0.9.1-all.jar -u "Sky.material.bin" -o "./unpacked"

          # 2. 找到解包出的 JSON 并安全地注入你的代码
          TARGET_JSON=$(find ./unpacked -name "*.json" | head -n 1)
          python3 -c "
          import json
          with open('$TARGET_JSON', 'r') as f:
              data = json.load(f)
          
          def patch_material(mat):
              mat['vertexShader'] = 'Sky.vertex'
              mat['fragmentShader'] = 'Sky.fragment'
              if 'passes' in mat:
                  for p in mat['passes']:
                      p['vertexShader'] = 'Sky.vertex'
                      p['fragmentShader'] = 'Sky.fragment'
                      if 'vertexFields' in p:
                          p['vertexFields'] = ['POSITION']
                      if 'samplers' in p:
                          p['samplers'] = ['s_sky_tex']

          if 'materials' in data:
              for k in data['materials']:
                  patch_material(data['materials'][k])
          else:
              patch_material(data)

          with open('$TARGET_JSON', 'w') as f:
              json.dump(data, f, indent=2)
          "

          # 3. 将你的着色器源码放入解包目录的 src 文件夹
          SRC_DIR=$(dirname "$TARGET_JSON")/src
          mkdir -p "$SRC_DIR"
          cp Sky.vertex.sc "$SRC_DIR/"
          cp Sky.fragment.sc "$SRC_DIR/"
          cp varying.def.sc "$SRC_DIR/"

          # 4. 用修改后的模板重新编译
          java -jar MaterialBinTool-0.9.1-all.jar -c "$TARGET_JSON" -o "./output" --shaderc "./shaderc"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Material-Bin
          path: ./output/