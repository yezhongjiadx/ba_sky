name: Build SkyBox Ultimate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Tools
        run: |
          wget https://build.lwjgl.org/nightly/linux/x64/bgfx-tools/shaderc
          chmod +x ./shaderc
          wget https://github.com/ddf8196/MaterialBinTool/releases/download/v0.9.1/MaterialBinTool-0.9.1-all.jar

      - name: Unpack Official Bin, Replace Code, and Compile
        run: |
          mkdir -p output
          mkdir -p unpacked
          
          # 1. 反编译
          BIN_FILE=$(find . -maxdepth 1 -name "*.material.bin" | head -n 1)
          echo "找到的原始文件: $BIN_FILE"
          java -jar MaterialBinTool-0.9.1-all.jar -u "$BIN_FILE" -o ./unpacked
          
          # 【打印一下解包出来的结构，方便排错】
          echo "====== 解包后的目录结构 ======"
          ls -R ./unpacked
          echo "=============================="
          
          # 2. 放宽搜索条件，找所有的 json
          TARGET_JSON=$(find ./unpacked -type f -name "*.json" | head -n 1)
          echo "找到的完美 JSON: $TARGET_JSON"
          
          if [ -z "$TARGET_JSON" ]; then
            echo "Error: 解包后找不到任何 JSON 文件！"
            exit 1
          fi
          
          # 3. 修改 JSON 里的着色器名字
          sed -i 's/"vertexShader": *"[^"]*"/"vertexShader": "Sky.vertex"/g' "$TARGET_JSON"
          sed -i 's/"fragmentShader": *"[^"]*"/"fragmentShader": "Sky.fragment"/g' "$TARGET_JSON"
          
          # 4. 把代码放入 src
          SRC_DIR=$(dirname "$TARGET_JSON")/src
          mkdir -p "$SRC_DIR"
          
          cat > "$SRC_DIR/Sky.vertex.sc" << 'EOF'
          $input a_position
          $output v_dir
          #include <bgfx_shader.sh>
          void main()
          {
              v_dir = a_position;
              gl_Position = mul(u_viewProj, vec4(a_position, 1.0));
          }
          EOF
          
          cat > "$SRC_DIR/Sky.fragment.sc" << 'EOF'
          $input v_dir
          #include <bgfx_shader.sh>
          SAMPLER2D(s_sky_tex, 0);
          void main()
          {
              vec3 dir = normalize(v_dir);
              float phi = atan(dir.z, dir.x);
              float theta = asin(dir.y);
              vec2 uv = vec2(phi / (2.0 * PI) + 0.5, theta / PI + 0.5);
              vec4 color = texture2D(s_sky_tex, uv);
              gl_FragColor = color;
          }
          EOF

          cat > "$SRC_DIR/Sky.varying.def.sc" << 'EOF'
          vec3 a_position  : POSITION;
          vec3 v_dir       : TEXCOORD0;
          EOF
          
          # 5. 编译
          java -jar MaterialBinTool-0.9.1-all.jar -c "$TARGET_JSON" -o "./output" --shaderc "./shaderc"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Material-Bin
          path: ./output/