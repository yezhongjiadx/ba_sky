name: Build SkyBox Ultimate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Tools
        run: |
          wget https://build.lwjgl.org/nightly/linux/x64/bgfx-tools/shaderc
          chmod +x ./shaderc
          wget https://github.com/ddf8196/MaterialBinTool/releases/download/v0.9.1/MaterialBinTool-0.9.1-all.jar

      - name: Unpack from Pro Shader, Inject Your Code, and Compile
        run: |
          mkdir -p output
          
          # 1. 反编译你提取出来的、有完整结构的社区版 Sky.material.bin
          java -jar MaterialBinTool-0.9.1-all.jar -u "Sky.material.bin" -o "./unpacked"
          
          TARGET_JSON=$(find ./unpacked -name "*.json" | head -n 1)
          
          # 2. 用 Python 安全注入你的代码（不做任何底层结构破坏）
          python3 -c "
          import json
          with open('$TARGET_JSON', 'r') as f:
              data = json.load(f)
          
          # 无论它原来有多少个 passes，我们只保留我们的这一层
          # 找到 passes 所在的层级（有的在根目录，有的在 materials 里）
          if 'materials' in data:
              mat_key = list(data['materials'].keys())[0]
              data['materials'][mat_key]['vertexShader'] = 'Sky.vertex'
              data['materials'][mat_key]['fragmentShader'] = 'Sky.fragment'
              # 有的 V3 格式还有 passes 数组，我们强行改掉
              if 'passes' in data['materials'][mat_key]:
                  for p in data['materials'][mat_key]['passes']:
                      p['vertexShader'] = 'Sky.vertex'
                      p['fragmentShader'] = 'Sky.fragment'
          else:
              data['vertexShader'] = 'Sky.vertex'
              data['fragmentShader'] = 'Sky.fragment'
              if 'passes' in data:
                  for p in data['passes']:
                      p['vertexShader'] = 'Sky.vertex'
                      p['fragmentShader'] = 'Sky.fragment'
          
          with open('$TARGET_JSON', 'w') as f:
              json.dump(data, f, indent=2)
          "
          
          # 3. 把你的代码放进它的 src 目录
          SRC_DIR=$(dirname "$TARGET_JSON")/src
          mkdir -p "$SRC_DIR"
          cp Sky.vertex.sc "$SRC_DIR/"
          cp Sky.fragment.sc "$SRC_DIR/"
          cp varying.def.sc "$SRC_DIR/"
          
          # 4. 重新打包编译
          java -jar MaterialBinTool-0.9.1-all.jar -c "$TARGET_JSON" -o "./output" --shaderc "./shaderc"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Material-Bin
          path: ./output/