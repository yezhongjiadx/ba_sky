name: Build SkyBox Ultimate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Tools
        run: |
          wget https://build.lwjgl.org/nightly/linux/x64/bgfx-tools/shaderc
          chmod +x ./shaderc
          wget https://github.com/ddf8196/MaterialBinTool/releases/download/v0.9.1/MaterialBinTool-0.9.1-all.jar

      - name: Unpack Official V3, Modify, and Compile
        run: |
          mkdir -p output
          
          # 1. 反编译你上传的 300B bin 文件，获取 V3 骨架
          java -jar MaterialBinTool-0.9.1-all.jar -u "Sky.material.bin" -o "./unpacked"
          
          # 找到解出来的 json
          TARGET_JSON=$(find ./unpacked -name "*.json" | head -n 1)
          
          # 2. 用 Python 脚本精准修改 V3 JSON，避免任何格式错误
          python3 -c "
          import json
          with open('$TARGET_JSON', 'r') as f:
              data = json.load(f)
          
          # 注入我们的采样器
          data['samplerDefinitionMap'] = {
              's_sky_tex': {
                  'reg': 0, 'access': 'Read', 'precision': 0, 'allowUnorderedAccess': False,
                  'type': 'Texture2D', 'textureFormat': 'float', 'unknown1': 1, 'unknownByte': 0,
                  'hasUnknownByte2': False, 'unknownByte2': 0, 'hasDefaultTexture': False,
                  'hasUnknownString': False, 'hasCustomTypeInfo': False
              }
          }
          
          # 注入我们的 passes 渲染通道 (注意 vertexFields 用纯字符串数组)
          data['passes'] = [
              {
                  'name': 'Sky',
                  'vertexShader': 'Sky.vertex',
                  'fragmentShader': 'Sky.fragment',
                  'renderMode': 'Sky',
                  'vertexFields': ['POSITION'],
                  'samplers': ['s_sky_tex']
              }
          ]
          
          with open('$TARGET_JSON', 'w') as f:
              json.dump(data, f, indent=2)
          "
          
          # 3. 建立 src 目录放入你的代码
          SRC_DIR=$(dirname "$TARGET_JSON")/src
          mkdir -p "$SRC_DIR"
          cp Sky.vertex.sc "$SRC_DIR/"
          cp Sky.fragment.sc "$SRC_DIR/"
          cp varying.def.sc "$SRC_DIR/"
          
          # 4. 重新编译
          java -jar MaterialBinTool-0.9.1-all.jar -c "$TARGET_JSON" -o "./output" --shaderc "./shaderc"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Material-Bin
          path: ./output/