name: Build SkyBox Ultimate (Final)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Tools
        run: |
          # 1. 下载稳定版 Linux shaderc
          wget https://build.lwjgl.org/nightly/linux/x64/bgfx-tools/shaderc
          chmod +x ./shaderc
          
          # 2. 下载 MaterialBinTool
          wget https://github.com/ddf8196/MaterialBinTool/releases/download/v0.9.1/MaterialBinTool-0.9.1-all.jar

      - name: Setup Standard Workspace
        run: |
          # 1. 从官方数据仓库下载标准 Sky.material.json 模板
          mkdir -p compile/SkyBox/src
          wget https://raw.githubusercontent.com/ddf8196/RenderDragonData/main/data/1.21.0.0/Android/Sky.material.json -O compile/SkyBox/Sky.material.json
          
          # 2. 现场生成着色器代码（与模板文件名匹配）
          cat > compile/SkyBox/src/Sky.vertex.sc << 'EOF'
          $input a_position
          $output v_dir
          #include <bgfx_shader.sh>
          void main()
          {
              v_dir = a_position;
              gl_Position = mul(u_viewProj, vec4(a_position, 1.0));
          }
          EOF
          
          cat > compile/SkyBox/src/Sky.fragment.sc << 'EOF'
          $input v_dir
          #include <bgfx_shader.sh>
          SAMPLER2D(s_sky_tex, 0);
          void main()
          {
              vec3 dir = normalize(v_dir);
              float phi = atan(dir.z, dir.x);
              float theta = asin(dir.y);
              vec2 uv = vec2(phi / (2.0 * PI) + 0.5, theta / PI + 0.5);
              vec4 color = texture2D(s_sky_tex, uv);
              gl_FragColor = color;
          }
          EOF
          
          cat > compile/SkyBox/src/Sky.varying.def.sc << 'EOF'
          vec3 a_position  : POSITION;
          vec3 v_dir       : TEXCOORD0;
          EOF
          
          # 3. 修改 JSON 文件，指向我们的着色器文件
          sed -i 's/"vertexShader": ".*"/"vertexShader": "Sky.vertex"/g' compile/SkyBox/Sky.material.json
          sed -i 's/"fragmentShader": ".*"/"fragmentShader": "Sky.fragment"/g' compile/SkyBox/Sky.material.json
          sed -i 's/"varyingDef": ".*"/"varyingDef": "Sky.varying"/g' compile/SkyBox/Sky.material.json

      - name: Compile SkyBox
        run: |
          mkdir -p output
          # 使用 -c 参数编译整个目录，MaterialBinTool 会自动处理依赖
          java -jar MaterialBinTool-0.9.1-all.jar -c "compile/SkyBox" -o "./output" --shaderc "./shaderc"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Material-Bin
          path: ./output/