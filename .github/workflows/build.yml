name: Build SkyBox Ultimate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Tools
        run: |
          # 1. 下载包含 Linux shaderc 的官方 bgfx 包
          wget https://www.nuget.org/api/v2/package/bgfx/1.0.20 -O bgfx.nupkg
          unzip bgfx.nupkg -d bgfx_pkg
          cp bgfx_pkg/runtimes/linux-x64/native/shaderc ./shaderc
          chmod +x ./shaderc
          
          # 2. 下载 MaterialBinTool
          wget https://github.com/ddf8196/MaterialBinTool/releases/download/v0.9.1/MaterialBinTool-0.9.1-all.jar

      - name: Compile SkyBox
        run: |
          mkdir -p output
          # 直接调用你仓库里现成的文件编译
          java -jar MaterialBinTool-0.9.1-all.jar -c "./lazurite_build/SkyBox/SkyBox.material.json" -o "./output" --shaderc "./shaderc"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Material-Bin
          path: ./output/