name: Build SkyBox Ultimate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build bgfx shaderc from source
        run: |
          # 安装编译依赖
          sudo apt-get update
          sudo apt-get install -y git make g++ libx11-dev libgl1-mesa-dev xorg-dev
          
          # 拉取 bgfx 源码，并确保拉取所有子模块
          git clone --recursive https://github.com/bkaradzic/bgfx.git
          cd bgfx
          
          # 关键修复：手动进入 bx 目录编译 genie
          cd bx/tools/bin/linux
          make
          cd ../../../../
          
          # 现在 genie 已经就位，开始编译 tools (包含 shaderc)
          make tools -j$(nproc)
          
          # 将编译好的 shaderc 提取出来
          cp .build/linux64_gcc/bin/shadercRelease ../shaderc
          cd ..
          chmod +x shaderc
          
          # 测试一下能不能跑
          ./shaderc --version

      - name: Download MaterialBinTool
        run: |
          wget https://github.com/ddf8196/MaterialBinTool/releases/download/v0.9.1/MaterialBinTool-0.9.1-all.jar

      - name: Generate Files and Compile
        run: |
          mkdir -p compile/SkyBox/src
          
          # 现场生成顶点着色器
          cat > compile/SkyBox/src/Sky.vertex.sc << 'EOF'
          $input a_position
          $output v_dir
          
          #include <bgfx_shader.sh>
          
          void main()
          {
              v_dir = a_position;
              gl_Position = mul(u_viewProj, vec4(a_position, 1.0));
          }
          EOF
          
          # 现场生成片元着色器
          cat > compile/SkyBox/src/Sky.fragment.sc << 'EOF'
          $input v_dir
          
          #include <bgfx_shader.sh>
          
          SAMPLER2D(s_sky_tex, 0);
          
          void main()
          {
              vec3 dir = normalize(v_dir);
              float phi = atan(dir.z, dir.x);
              float theta = asin(dir.y);
              vec2 uv = vec2(phi / (2.0 * PI) + 0.5, theta / PI + 0.5);
              vec4 color = texture2D(s_sky_tex, uv);
              gl_FragColor = color;
          }
          EOF
          
          # 现场生成 varying 定义
          cat > compile/SkyBox/src/Sky.varying.def.sc << 'EOF'
          vec3 a_position  : POSITION;
          vec3 v_dir       : TEXCOORD0;
          EOF
          
          # 现场生成最标准的 JSON
          cat > compile/SkyBox/Sky.material.json << 'EOF'
          {
            "materials": {
              "version": 1,
              "Sky": {
                "vertexShader": "Sky.vertex",
                "fragmentShader": "Sky.fragment",
                "variants": [
                  {
                    "passes": [
                      {
                        "renderMode": "Sky",
                        "vertexShader": "Sky.vertex",
                        "fragmentShader": "Sky.fragment"
                      }
                    ]
                  }
                ]
              }
            }
          }
          EOF
          
          mkdir -p output
          # 开始编译
          java -jar MaterialBinTool-0.9.1-all.jar -c compile/SkyBox/Sky.material.json -o ./output --shaderc ./shaderc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Material-Bin
          path: ./output/