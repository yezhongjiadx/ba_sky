name: Build SkyBox with Custom JSON

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Tools
        run: |
          # 下载 Linux 版 shaderc
          wget https://build.lwjgl.org/nightly/linux/x64/bgfx-tools/shaderc
          chmod +x ./shaderc
          
          # 下载 MaterialBinTool
          wget https://github.com/ddf8196/MaterialBinTool/releases/download/v0.9.1/MaterialBinTool-0.9.1-all.jar

      - name: Compile with Perfect JSON
        run: |
          # 创建输出目录
          mkdir -p output
          
          # 直接编译你找出来的那个完美 JSON！
          # (注意：如果你的 JSON 放在了别的路径，请改下面这一行)
          java -jar MaterialBinTool-0.9.1-all.jar -c "Sky.material.json" -o "./output" --shaderc "./shaderc"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Material-Bin
          path: ./output/