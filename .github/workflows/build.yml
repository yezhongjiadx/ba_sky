name: Build SkyBox Ultimate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Tools & Data
        run: |
          # 1. 下载稳定版编译器
          wget https://build.lwjgl.org/nightly/linux/x64/bgfx-tools/shaderc
          chmod +x ./shaderc
          
          # 2. 下载 MaterialBinTool 0.9.1
          wget https://github.com/ddf8196/MaterialBinTool/releases/download/v0.9.1/MaterialBinTool-0.9.1-all.jar
          
          # 3. 【终极杀招】克隆官方材质数据仓库
          git clone --depth 1 https://github.com/ddf8196/RenderDragonData.git

      - name: Setup Perfect Native Workspace
        run: |
          # 在工作区建立一个干净的编译目录
          mkdir -p compile/src
          mkdir -p output
          
          # 1. 从官方仓库里直接抓取原版的 SkyBox JSON（绕过一切手写错误）
          # 使用 find 确保能找到（不管它放在哪个版本文件夹里）
          cp $(find RenderDragonData -name "SkyBox.material.json" | head -n 1) compile/SkyBox.material.json
          
          # 2. 强行把原版 JSON 里的着色器名字改成你的代码名
          sed -i 's/"vertexShader": *"[^"]*"/"vertexShader": "Sky.vertex"/g' compile/SkyBox.material.json
          sed -i 's/"fragmentShader": *"[^"]*"/"fragmentShader": "Sky.fragment"/g' compile/SkyBox.material.json
          
          # 3. 现场生成你的着色器代码（直接写死，绝对纯净）
          cat > compile/src/Sky.vertex.sc << 'EOF'
          $input a_position
          $output v_dir
          #include <bgfx_shader.sh>
          void main()
          {
              v_dir = a_position;
              gl_Position = mul(u_viewProj, vec4(a_position, 1.0));
          }
          EOF
          
          cat > compile/src/Sky.fragment.sc << 'EOF'
          $input v_dir
          #include <bgfx_shader.sh>
          SAMPLER2D(s_sky_tex, 0);
          void main()
          {
              vec3 dir = normalize(v_dir);
              float phi = atan(dir.z, dir.x);
              float theta = asin(dir.y);
              vec2 uv = vec2(phi / (2.0 * PI) + 0.5, theta / PI + 0.5);
              vec4 color = texture2D(s_sky_tex, uv);
              gl_FragColor = color;
          }
          EOF

          cat > compile/src/Sky.varying.def.sc << 'EOF'
          vec3 a_position  : POSITION;
          vec3 v_dir       : TEXCOORD0;
          EOF
          
          # 4. 编译
          java -jar MaterialBinTool-0.9.1-all.jar -c "compile/SkyBox.material.json" -o "./output" --shaderc "./shaderc"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Material-Bin
          path: ./output/